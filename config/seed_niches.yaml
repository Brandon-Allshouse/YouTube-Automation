# Seed niches for discovery. The researcher and niche_score.py rank these; nothing here is final.
# rpm_usd: rough public estimates for ad RPM by topic category. Placeholders until we have our own
#   YouTube Analytics data; treat as priors, not facts.
# visual_fit: 0-1, how well our engine's components (maps, charts, timelines, diagrams, comparisons)
#   express the niche. Judged by the build agent; the researcher should revise with evidence.
# evergreen: prior that topics stay relevant > 1 year.
