# Demo Short (channel: atlas). Original writing; facts paraphrased and cited below.
# Markup: *word* = emphasis in captions; {display|spoken} = caption shows display, voice says spoken.
# Visual elements follow the scene spec schema (engine/schema/scene_spec.schema.json);
# at_word / reveal_words anchor animation timing to the narration.
id: mercator-short
channel: atlas
format: short
seed: 1569
titles:
  - "Greenland Isn't Huge. Your Map Is."
  - "Why Every World Map Makes Greenland Look Giant"
  - "A 1569 Sailing Map Still Shapes How You See the World"
thumbnails:
  - {text: "AFRICA ×14", visual: "Greenland and Africa drawn as true-area squares, tiny vs huge, brass vs teal"}
  - {text: "Your map lies", visual: "Mercator crop: inflated Greenland with its dashed true-size outline inside"}
  - {text: "Not this big", visual: "Inflated Greenland outline with a red strike through, true-size inset"}
description: >-
  Greenland looks as big as Africa on most world maps. It isn't even close: Africa is about
  fourteen times larger. The reason is a navigation map from 1569 that is still with us.
  Sources in the pinned comment. Visuals and music are generated by our own code; narration is a
  synthetic voice.
segments:
  - id: hook
    tag: kinetic-title
    text: "Greenland looks as big as *Africa*, but it isn't even close."
    transition: null
    visual:
      - {type: AnimatedMap, projection: mercator, center_from: [-12, 42], zoom_from: 2.0, center_to: [-12, 38], zoom_to: 2.25, move_duration: 4.0, highlight: ["GRL"], highlight_continents: ["Africa"], highlight_at: 0.3, markers: [{lon: -42, lat: 74, label: "Greenland", at: 0.5}, {lon: 18, lat: 8, label: "Africa", at: 1.0}]}
  - id: reveal
    tag: map
    text: "Slide Greenland down to Africa at its true size. Africa is *fourteen* times bigger."
    visual:
      - {type: AnimatedMap, projection: mercator, center_from: [-12, 38], zoom_from: 2.25, center_to: [5, 25], zoom_to: 2.1, move_duration: 2.5, highlight_continents: ["Africa"], highlight_at: 0.0, moves: [{country: GRL, to: [20, 4], start: 0.4, duration: 2.6}], until_word: "Africa#2"}
      - {type: ComparisonSplit, left: {label: "Greenland", value: 2.17}, right: {label: "Africa", value: 30.37}, unit: "M km²", mode: area, decimals: 2, compact: false, stagger: 0.3, at_word: "Africa#2"}
  - id: culprit
    tag: kinetic-title
    text: "Blame a map from *{1569|fifteen sixty-nine}*."
    visual:
      - {type: KineticTitle, text: "Mercator's map, 1569", kicker: "The culprit", emphasis: ["1569"], size: xl, entrance: rise, underline: true}
  - id: sailors
    tag: kinetic-title
    text: "Gerardus Mercator built it for sailors. On his map, a straight line is a steady compass heading."
    visual:
      - {type: KineticTitle, text: "Built for sailors", kicker: "Gerardus Mercator", emphasis: ["sailors"], size: xl, entrance: mask, until_word: "On"}
      - {type: AnimatedMap, projection: mercator, center_from: [-40, 32], zoom_from: 2.6, highlight_at: 30, graticule: true, paths: [{points: [[-9.1, 38.7], [-75.5, 18.5]], kind: rhumb, start: 0.6, duration: 2.2}], markers: [{lon: -9.1, lat: 38.7, label: "Lisbon", at: 0.2}, {lon: -75.5, lat: 18.5, label: "Caribbean", at: 2.6}], at_word: "On"}
  - id: tradeoff
    tag: list
    text: "To keep those angles true, the map has to stretch. The farther from the equator, the bigger the stretch."
    visual:
      - {type: ListReveal, title: "The trade-off", items: ["Angles stay true", "The map must stretch", "Worse toward the poles"], reveal_words: ["angles", "stretch.", "farther"]}
  - id: sixty
    tag: stat
    text: "At *{60°|sixty degrees}* north, land is drawn about *four* times too big."
    visual:
      - {type: StatCounter, value: 4, from_value: 1, suffix: "×", label: "area inflation at 60° N", ring: 0.75, count_duration: 1.4, count_at_word: "four"}
  - id: alaska
    tag: comparison
    text: "So Alaska looks like Brazil, which is *five* times larger."
    visual:
      - {type: ComparisonSplit, left: {label: "Alaska", value: 1.72}, right: {label: "Brazil", value: 8.52}, unit: "M km²", mode: area, decimals: 2, compact: false, stagger: 0.45}
  - id: poles
    tag: kinetic-title
    text: "And the poles? They'd be infinitely large, so the map just cuts them off."
    transition: {kind: zoom, duration: 0.5, easing: in_out_expo}
    visual:
      - {type: KineticTitle, text: "And the poles?", kicker: "Infinite stretch", emphasis: ["poles?"], size: xl, entrance: pop, until_word: "so"}
      - {type: KineticTitle, text: "Simply cut off", kicker: "Map edge ≈ 85°", emphasis: ["cut", "off"], size: xl, entrance: mask, at_word: "so"}
  - id: purpose
    tag: kinetic-title
    text: "It was never meant for comparing countries. It was meant to get ships home."
    visual:
      - {type: KineticTitle, text: "Not a size chart", kicker: "The real purpose", emphasis: ["Not"], size: xl, entrance: rise, until_word: "meant#2"}
      - {type: KineticTitle, text: "Made to get ships home", emphasis: ["ships", "home"], size: l, entrance: mask, at_word: "to"}
  - id: today
    tag: kinetic-title
    text: "Yet a version of it still powers most zoomable web maps."
    visual:
      - {type: KineticTitle, text: "Still powering web maps", kicker: "Web Mercator", emphasis: ["web", "maps"], size: l, entrance: rise}
  - id: payoff
    tag: kinetic-title
    text: "So when a country looks huge, check how close it is to the pole."
    visual:
      - {type: AnimatedMap, projection: mercator, morph_to: equal_earth, morph_start: 0.3, morph_duration: 3.0, center_from: [0, 28], zoom_from: 1.3, center_to: [0, 12], zoom_to: 1.5, move_start: 0.3, move_duration: 3.0, highlight: ["GRL"], highlight_continents: ["Africa"], highlight_at: 0.0, graticule: true}
      - {type: KineticTitle, text: "Check the latitude", emphasis: ["latitude"], size: l, region: top, entrance: mask, underline: true, start: 0.6}
sources:
  - {claim: "Greenland total area ≈ 2.17 million km²", url: "https://stat.gl/publ/en/SA/201002/content/Geography.htm"}
  - {claim: "Africa ≈ 30.37 million km², about 14× Greenland", url: "https://www.britannica.com/place/Africa"}
  - {claim: "Mercator published the projection in 1569 for navigation; rhumb lines are straight", url: "https://personal.math.ubc.ca/~israel/m103/mercator/mercator.html"}
  - {claim: "Linear scale = sec(latitude); area scale = sec²(latitude) = 4 at 60°", url: "https://personal.math.ubc.ca/~israel/m103/mercator/mercator.html"}
  - {claim: "Brazil ≈ 8.52 million km², Alaska ≈ 1.72 million km² (Brazil ≈ 5×)", url: "https://www.sciencefocus.com/science/are-most-maps-of-the-world-wrong"}
  - {claim: "Most tiled web maps (OpenStreetMap, Google Maps) use Web Mercator, cut off near 85°", url: "https://osmdata.openstreetmap.de/info/projections.html"}
ai_disclosure: false
